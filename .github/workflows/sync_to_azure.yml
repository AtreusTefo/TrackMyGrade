name: Sync to Azure DevOps

on:
  push:
    branches:
      - main
      - dev3

jobs:
  build-and-sync:
    runs-on: windows-latest 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet Packages
        run: nuget restore TrackMyGradeAPI/TrackMyGradeAPI.sln

      - name: Build Web Application
        run: msbuild TrackMyGradeAPI/TrackMyGradeAPI.sln /p:Configuration=Release

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Push to Azure DevOps
        env:
          AZURE_DEVOPS_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
        run: |
          git remote add azure "https://%AZURE_DEVOPS_PAT%@dev.azure.com/teforamokate/TrackMyGrade/_git/TrackMyGrade"
          git push azure ${{ github.ref_name }}
