name: Sync to Azure DevOps

on:
  push:
    branches:
      - main
      - dev3

jobs:
  build-and-sync:
    runs-on: windows-latest 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Backend Setup and Build
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet Packages
        run: nuget restore TrackMyGradeAPI/TrackMyGradeAPI.sln

      - name: Build Backend (Release)
        run: msbuild TrackMyGradeAPI/TrackMyGradeAPI.sln /p:Configuration=Release /p:Platform=AnyCPU

      # Frontend Setup and Build
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'StudentApp/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          cd StudentApp
          npm ci

      - name: Build Frontend (Production)
        run: |
          cd StudentApp
          npm run build

      # Configure Git for Azure DevOps Push
      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      # Push to Azure DevOps using PAT via git credential helper
      - name: Push to Azure DevOps
        env:
          AZURE_DEVOPS_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
          AZURE_DEVOPS_ORG: teforamokate
          AZURE_DEVOPS_PROJECT: TrackMyGrade
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          $azureUrl = "https://dev.azure.com/$env:AZURE_DEVOPS_ORG/$env:AZURE_DEVOPS_PROJECT/_git/$env:AZURE_DEVOPS_PROJECT"
          $encodedPat = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes(":$env:AZURE_DEVOPS_PAT"))
          git -c http.extraheader="AUTHORIZATION: basic $encodedPat" push $azureUrl $env:BRANCH_NAME --force

      # Collect build artifacts
      - name: Upload Backend Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: TrackMyGradeAPI/bin/Release/
          retention-days: 7

      - name: Upload Frontend Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: StudentApp/dist/
          retention-days: 7
